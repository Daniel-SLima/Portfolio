name: Portfolio Quality Gate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-build-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify resume PDF assets exist
        run: |
          test -f public/cv/Curriculo-Daniel-Lima-QA-Automacao.pdf
          test -f public/cv/Curriculo-Daniel-Lima-FullStack.pdf
          test -f public/cv/Curriculo-Daniel-Lima-Dados-Operacoes.pdf
          test -f public/cv/Resume-Daniel-Lima-EN.pdf
          test -f public/cv/Linkedin-Daniel-Lima.pdf

      - name: Run strict TypeScript check
        run: npm run typecheck

      - name: Build Next.js production bundle
        run: npm run build
