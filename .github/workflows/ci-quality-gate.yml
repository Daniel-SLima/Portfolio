name: Portfolio Quality Gate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-build-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify current resume PDF assets
        run: |
          for file in \
            public/cv/Curriculo-Daniel-Lima-QA-Automacao.pdf \
            public/cv/Curriculo-Daniel-Lima-FullStack.pdf \
            public/cv/Resume-Daniel-Lima-QA-EN.pdf \
            public/cv/Resume-Daniel-Lima-FullStack-EN.pdf
          do
            test -s "$file"
            test "$(head -c 5 "$file")" = '%PDF-'
          done

      - name: Run strict TypeScript check
        run: npm run typecheck

      - name: Build Next.js production bundle
        run: npm run build
