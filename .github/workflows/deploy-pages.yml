name: Deploy Portfolio and Browser Demos to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Check portfolio types
        run: npm run typecheck

      - name: Build Next.js Static Export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Setup Flutter for the browser-only Vlinix demonstration
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Build demonstrations from pinned source commits
        run: node scripts/demos/build-demos.mjs
        env:
          CI: 'true'

      - name: Verify the complete Pages artifact
        run: python3 scripts/demos/verify-export.py

      - name: Add .nojekyll to preserve _next folder
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
